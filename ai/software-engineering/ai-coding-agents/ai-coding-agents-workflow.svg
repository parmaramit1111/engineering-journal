<g class="body">
<text x="25" y="195">• Define the problem</text><text x="25" y="222">• Set goals and context</text><text x="25" y="249">• Provide requirements</text><text x="25" y="276">• Guide the agent</text>
<text x="280" y="195">• Understands context</text><text x="280" y="222">• Writes and modifies code</text><text x="280" y="249">• Works across multiple files</text><text x="280" y="276">• Suggests improvements</text><text x="280" y="303">• Runs and fixes issues</text>
<text x="535" y="195">• New features</text><text x="535" y="222">• Refactoring</text><text x="535" y="249">• Bug fixes</text><text x="535" y="276">• Documentation</text><text x="535" y="303">• Tests</text>
<text x="790" y="195">• Automated tests</text><text x="790" y="222">• Code quality checks</text><text x="790" y="249">• Security scanning</text><text x="790" y="276">• Build and deployment</text><text x="790" y="303">• Detects issues early</text>
<text x="1045" y="195">• Review AI-generated code</text><text x="1045" y="222">• Validate design choices</text><text x="1045" y="249">• Check security and risks</text><text x="1045" y="276">• Ensure code quality</text><text x="1045" y="303">• Provide final approval</text>
<text x="1300" y="195">• Deploy to production</text><text x="1300" y="222">• Monitor behaviour</text><text x="1300" y="249">• Track performance</text><text x="1300" y="276">• Observe and learn</text><text x="1300" y="303">• Iterate and improve</text></g>
<g stroke="#2869c8" stroke-width="4" fill="none"><path d="M245 165h10l-7-7m7 7-7 7"/><path d="M500 165h10l-7-7m7 7-7 7"/><path d="M755 165h10l-7-7m7 7-7 7"/><path d="M1010 165h10l-7-7m7 7-7 7"/><path d="M1265 165h10l-7-7m7 7-7 7"/></g>
</g>
<text x="640" y="642" class="sub" font-size="18">Feedback and continuous improvement</text>
<rect x="20" y="670" width="1560" height="205" rx="24" fill="#eaf5ff" stroke="#d6e6f7"/>
<text x="625" y="707" class="title" font-size="26">Human Judgment and Responsibility</text><text x="625" y="734" class="small">AI can implement. Humans set direction, make decisions, and take responsibility.</text>
<g transform="translate(30,750)">
<g><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Requirements</text><text x="20" y="61" class="small">• Define business needs</text><text x="20" y="82" class="small">  and user impact</text></g>
<g transform="translate(255)"><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Architecture</text><text x="20" y="61" class="small">• Design system structure</text><text x="20" y="82" class="small">  and trade-offs</text></g>
<g transform="translate(510)"><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Security</text><text x="20" y="61" class="small">• Identify risks and validate</text><text x="20" y="82" class="small">  dependencies</text></g>
<g transform="translate(765)"><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Code Review</text><text x="20" y="61" class="small">• Review logic and bias</text><text x="20" y="82" class="small">  and ensure quality</text></g>
<g transform="translate(1020)"><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Testing Strategy</text><text x="20" y="61" class="small">• Define coverage and</text><text x="20" y="82" class="small">  critical scenarios</text></g>
<g transform="translate(1275)"><rect width="245" height="105" rx="15" fill="#fff"/><text x="20" y="32" class="head">Final Decision</text><text x="20" y="61" class="small">• Own what goes to</text><text x="20" y="82" class="small">  production</text></g>
</g>
