<text x="145" y="119" class="small" letter-spacing="4">PRACTICAL NOTES FOR BETTER SOFTWARE</text>
<text x="1350" y="62" class="sub" font-style="italic">Build</text><text x="1430" y="62" class="sub" font-style="italic">Learn</text><text x="1510" y="62" class="sub" font-style="italic">Share</text>
<path d="M55 145H160" stroke="#2475df" stroke-width="5"/>
<text x="52" y="205" class="title"><tspan class="blue">AI Coding Agents</tspan><tspan> in the Software Development Workflow</tspan></text>
<text x="52" y="242" class="sub">AI can accelerate implementation. Engineering responsibility still stays with humans.</text>
